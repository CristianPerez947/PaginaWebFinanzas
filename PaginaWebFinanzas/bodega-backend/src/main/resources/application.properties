spring.application.name=Cuaderno de Fiado Digital
spring.profiles.default=dev

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# JWT (el secreto debe tener al menos 32 caracteres; en producción se define con JWT_SECRET)
autorizacion.jwt.secreto=${JWT_SECRET:clave-secreta-solo-para-desarrollo-cambiar-en-produccion-2026}
autorizacion.jwt.expiracion.dias=1

# CORS: URL(s) del frontend separadas por coma
cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}

# Datos de demostración y administrador inicial
semilla.admin.usuario=${ADMIN_USUARIO:admin}
semilla.admin.clave=${ADMIN_CLAVE:admin123}
semilla.datos-demo=${SEMILLA_DEMO:true}

spring.jackson.time-zone=America/Lima
